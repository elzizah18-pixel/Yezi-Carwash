/* ================================================
   style.css — YeZi Car Wash
   Semua style dipindahkan dari <style> internal
   ================================================ */

/* ---- RESET ---- */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* ---- BODY ---- */
body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(180deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
    color: #ffffff;
    display: flex;
    justify-content: center;
    padding: 15px;
    min-height: 100vh;
}

.container {
    width: 100%;
    max-width: 1300px;
    text-align: center;
}

/* ---- HEADER ---- */
h1 {
    font-size: 42px;
    color: #ffd700;
    margin-bottom: 5px;
    text-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
}

.subtitle {
    color: #aaa;
    font-size: 14px;
    margin-bottom: 20px;
}

/* ---- NOTIFIKASI ---- */
.notif {
    background: #4caf50;
    color: #fff;
    padding: 14px 20px;
    border-radius: 12px;
    margin-bottom: 15px;
    display: none;
    font-weight: 600;
    white-space: pre-line;
    box-shadow: 0 8px 25px rgba(0,0,0,0.3);
}

.notif.show {
    display: block;
    animation: slideDown 0.4s ease;
}

@keyframes slideDown {
    from { opacity: 0; transform: translateY(-30px); }
    to   { opacity: 1; transform: translateY(0); }
}

/* ---- DASHBOARD ---- */
.dashboard {
    background: rgba(255,255,255,0.08);
    padding: 15px 20px;
    border-radius: 15px;
    margin-bottom: 20px;
    display: flex;
    justify-content: space-around;
    flex-wrap: wrap;
    gap: 10px;
    border: 2px solid rgba(255,215,0,0.2);
}

.dashboard-item { text-align: center; }

.dashboard-item .label {
    font-size: 10px;
    color: #aaa;
    text-transform: uppercase;
    letter-spacing: 1px;
}

.dashboard-item .value {
    font-size: 24px;
    font-weight: 800;
    color: #ffd700;
}

@keyframes pulse {
    0%, 100% { transform: scale(1); }
    50%       { transform: scale(1.15); color: #ff9800; }
}

.dashboard .value.updated {
    animation: pulse 0.4s ease;
}

/* ---- FORM ---- */
.form-group {
    background: rgba(255,255,255,0.05);
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 20px;
    border: 1px solid rgba(255,255,255,0.1);
}

.form-group label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    text-align: left;
    color: #ccc;
    font-size: 13px;
    text-transform: uppercase;
}

.form-group input[type="text"] {
    width: 100%;
    padding: 12px 16px;
    border-radius: 10px;
    border: 2px solid #333;
    background: #111;
    color: #fff;
    font-size: 16px;
    margin-bottom: 15px;
    outline: none;
    transition: 0.3s;
}

.form-group input[type="text"]:focus {
    border-color: #ffd700;
    box-shadow: 0 0 15px rgba(255,215,0,0.2);
}

/* ---- KARTU LAYANAN ---- */
.layanan-options {
    display: flex;
    gap: 10px;
    margin-bottom: 15px;
    flex-wrap: wrap;
}

.layanan-card {
    flex: 1;
    min-width: 100px;
    padding: 15px 10px;
    border-radius: 12px;
    background: rgba(255,255,255,0.05);
    cursor: pointer;
    border: 2px solid transparent;
    transition: 0.3s;
    text-align: center;
}

.layanan-card:hover {
    border-color: #ffd700;
    background: rgba(255,255,255,0.1);
}

.layanan-card.selected {
    border-color: #ffd700;
    background: #e94560;
    box-shadow: 0 0 25px rgba(233,69,96,0.5);
}

.layanan-card .icon         { font-size: 35px; display: block; margin-bottom: 5px; }
.layanan-card .nama-layanan { font-weight: 700; font-size: 14px; display: block; }
.layanan-card .harga        { font-size: 11px; color: #ccc; display: block; }
.layanan-card .estimasi     { font-size: 10px; color: #999; display: block; }

/* ---- TOMBOL ---- */
.btn-group {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    justify-content: center;
}

button {
    padding: 12px 20px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-weight: 600;
    font-size: 14px;
    transition: 0.3s;
    color: #fff;
}

button:hover:not(:disabled) {
    transform: translateY(-3px);
    box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}

button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}

.btn-tambah { background: #4caf50; }
.btn-reset  { background: #f44336; }
.btn-cuci {
    background: #2196F3;
    width: 100%;
    margin-top: 5px;
    padding: 14px;
    font-size: 15px;
}

/* ---- PANEL AREA ---- */
.panel-container {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

.jalur-cuci {
    flex: 1;
    min-width: 350px;
    background: rgba(255,255,255,0.03);
    border-radius: 15px;
    border: 1px solid rgba(255,255,255,0.1);
    overflow: hidden;
}

.jalur-header {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    padding: 12px;
    font-weight: 700;
}

.jalur-manual   .jalur-header { background: #ff9800; }
.jalur-otomatis .jalur-header { background: #2196F3; }
.jalur-hidrolik .jalur-header { background: #e94560; }

.jalur-header h3 { font-size: 16px; }

/* ---- AREA ANTRIAN ---- */
.area-antrian {
    padding: 12px;
    background: rgba(0,0,0,0.3);
    min-height: 110px;
}

.jalan-raya {
    background: #1a1a2e;
    border-radius: 8px;
    padding: 15px 10px;
    min-height: 70px;
    position: relative;
    overflow-x: auto;
}

.slot-antrian {
    display: flex;
    gap: 12px;
    align-items: center;
    position: relative;
    z-index: 1;
}

.mobil-antrian-item {
    font-size: 50px;
    display: inline-block;
    animation: mobilMasuk 0.5s ease;
    flex-shrink: 0;
    position: relative;
}

/* Label nama pelanggan di bawah emoji mobil */
.mobil-antrian-item::after {
    content: attr(data-nama);
    position: absolute;
    bottom: -20px;
    left: 50%;
    transform: translateX(-50%);
    font-size: 10px;
    background: #000;
    color: #fff;
    padding: 10px 10px;
    border-radius: 10px;
    white-space: nowrap;
}

@keyframes mobilMasuk {
    from { transform: translateX(-60px); opacity: 0; }
    to   { transform: translateX(0);     opacity: 1; }
}

.label-area {
    font-size: 10px;
    color: #888;
    margin-top: 5px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* ---- AREA CUCI ---- */
.area-cuci {
    padding: 10px;
    background: rgba(0,0,50,0.3);
    min-height: 160px;
}

.ruang-cuci {
    background: #1a1a2e;
    border-radius: 10px;
    padding: 20px 15px;
    position: relative;
    min-height: 140px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    border: 2px solid rgba(255,255,255,0.1);
}

.mobil-cuci-container {
    font-size: 110px;
    z-index: 2;
    transition: 0.5s;
    line-height: 1;
}

/* Efek hidrolik: mobil naik-turun */
.mobil-cuci-container.terangkat {
    animation: naikTurun 1s ease-in-out infinite alternate;
}

@keyframes naikTurun {
    from { transform: translateY(0); }
    to   { transform: translateY(-25px); }
}

/* Mobil bergoyang saat dicuci */
.mobil-sedang-dicuci {
    display: inline-block;
    animation: goyang 0.3s ease infinite;
}

@keyframes goyang {
    0%, 100% { transform: rotate(0); }
    25%       { transform: rotate(-4deg); }
    75%       { transform: rotate(4deg); }
}

/* ---- EFEK CUCIAN ---- */
.efek-cucian {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    pointer-events: none;
    z-index: 3;
    display: none;
}

.efek-cucian span { position: absolute; font-size: 28px; }

.efek-cucian .pekerja { left: 10%;  top: 30%; animation: geser   1.5s ease-in-out infinite; }
.efek-cucian .robot   { left: 10%;  top: 30%; animation: geser   1.5s ease-in-out infinite; }
.efek-cucian .spons   { left: 30%;  top: 40%; animation: putar   1s   linear     infinite; }
.efek-cucian .sabun   { left: 50%;  top: 20%; animation: busa    2s   ease-in-out infinite; }
.efek-cucian .air     { right: 25%; top: 35%; animation: semprot 0.6s ease-in-out infinite; }
.efek-cucian .sikat   { left: 40%;  top: 25%; animation: putar   0.8s linear     infinite; }
.efek-cucian .lift    { left: 15%;  bottom: 15%; font-size: 35px; }

@keyframes geser {
    0%, 100% { transform: translateX(0); }
    50%       { transform: translateX(25px); }
}

@keyframes putar {
    from { transform: rotate(0); }
    to   { transform: rotate(360deg); }
}

@keyframes busa {
    0%, 100% { transform: scale(0.5); opacity: 0; }
    50%       { transform: scale(1.5); opacity: 1; }
}

@keyframes semprot {
    0%, 100% { transform: translateY(0);     opacity: 0.5; }
    50%       { transform: translateY(-15px); opacity: 1; }
}

/* ---- PROGRESS BAR ---- */
.progress-container {
    background: rgba(255,255,255,0.2);
    border-radius: 10px;
    height: 10px;
    overflow: hidden;
    margin-top: 8px;
    width: 100%;
}

.progress-bar {
    height: 100%;
    background: #4caf50;
    border-radius: 10px;
    width: 0%;
    transition: width 0.5s;
}

.timer-text {
    font-size: 18px;
    font-weight: 700;
    color: #ffd700;
    font-family: monospace;
    margin-top: 3px;
}

/* ---- AREA KELUAR ---- */
.area-keluar {
    padding: 15px 10px;
    background: rgba(0,50,0,0.2);
    min-height: 100px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
}

.mobil-bersih-container { font-size: 80px; line-height: 1; }

.mobil-selesai { display: inline-block; }

.mobil-selesai.kinclong {
    animation: kinclong 0.6s ease infinite alternate;
}

@keyframes kinclong {
    from { filter: brightness(1);   transform: scale(1); }
    to   { filter: brightness(1.5) drop-shadow(0 0 15px gold); transform: scale(1.15); }
}

/* ---- CONFETTI ---- */
.confetti-particle {
    position: fixed;
    top: -50px;
    z-index: 9999;
    pointer-events: none;
    animation: confettiJatuh 2.5s ease-out forwards;
}

@keyframes confettiJatuh {
    0%   { transform: translateY(0)     rotate(0deg);   opacity: 1; }
    100% { transform: translateY(105vh) rotate(720deg); opacity: 0; }
}

/* ---- RESPONSIVE ---- */
@media (max-width: 1100px) {
    .panel-container { flex-direction: column; }
    .jalur-cuci      { min-width: 100%; }
}

@media (max-width: 500px) {
    h1                        { font-size: 22px; }
    .mobil-cuci-container     { font-size: 80px; }
    .mobil-bersih-container   { font-size: 60px; }
}
